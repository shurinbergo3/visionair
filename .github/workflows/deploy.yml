name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel an in-flight build if a newer commit is pushed.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # shurinbergo3/visionair

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR with the built-in GITHUB_TOKEN
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            INDEXNOW_KEY=${{ secrets.INDEXNOW_KEY }}
            INDEXNOW_ENABLE=1
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Tell Dokploy to pull the new :latest image and recreate the container.
      # Skipped until the DOKPLOY_DEPLOY_URL secret exists (so the first build,
      # which only seeds the GHCR image, doesn't fail here).
      - name: Trigger Dokploy deploy
        if: env.DOKPLOY_DEPLOY_URL != ''
        env:
          DOKPLOY_DEPLOY_URL: ${{ secrets.DOKPLOY_DEPLOY_URL }}
        run: curl -fsSL -X GET "$DOKPLOY_DEPLOY_URL"
